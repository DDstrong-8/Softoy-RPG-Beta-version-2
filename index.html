<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Softoy RPG — Prototype 3</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

button {
    font-family: inherit;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#9bd86b, #70b84f);
}

/* =====================================================
   EXPLORATION
   ===================================================== */

#world {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

#worldCanvas {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: transform .05s linear;
}

.grass {
    position: absolute;
    width: 4px;
    height: 13px;
    background: #4d9239;
    border-radius: 5px;
    opacity: .65;
}

/* =====================================================
   PLAYER
   ===================================================== */

#player {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    z-index: 20;
}

.player-body {
    width: 60px;
    height: 60px;
    border-radius: 48%;
    background: #f1c79f;
    border: 4px solid #563728;
    position: relative;
    box-shadow: 0 5px 10px rgba(0,0,0,.18);
}

.player-eye {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #111;
    border-radius: 50%;
    top: 17px;
}

.player-eye.left {
    left: 14px;
}

.player-eye.right {
    right: 14px;
}

/* =====================================================
   WORLD ENEMIES
   ===================================================== */

.world-enemy {
    position: absolute;
    z-index: 15;
    text-align: center;
}

.enemy-dot {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.3);
    box-shadow: 0 4px 8px rgba(0,0,0,.15);
}

.enemy-label {
    margin-top: 3px;
    font-size: 9px;
    font-weight: bold;
    color: #17350e;
    text-shadow: 0 1px white;
}

/* =====================================================
   TOP UI
   ===================================================== */

#topUI {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 100;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.info {
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(20,30,20,.7);
    color: white;
    font-size: 12px;
    backdrop-filter: blur(10px);
}

/* =====================================================
   MANAGE SQUAD BUTTON
   ===================================================== */

#manageButton {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 110;
    border: 0;
    border-radius: 14px;
    padding: 11px 14px;
    background: rgba(255,255,255,.28);
    color: #17324a;
    font-weight: bold;
    backdrop-filter: blur(12px);
}

/* =====================================================
   JOYSTICK
   ===================================================== */

#joystick {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.35);
    backdrop-filter: blur(12px);
    z-index: 100;
}

#stick {
    position: absolute;
    left: 39px;
    top: 39px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
    border: 2px solid rgba(255,255,255,.7);
}

/* =====================================================
   BATTLE
   ===================================================== */

#battle {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 300;
    color: white;
    background:
        radial-gradient(circle at center,
        #719d5c 0%,
        #456f3d 48%,
        #253b28 100%);
}

#battleTitle {
    position: absolute;
    top: 13px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 14px;
    background: rgba(0,0,0,.45);
    font-weight: bold;
}

/* =====================================================
   ENEMY FORMATION
   ===================================================== */

#enemyFormation {
    position: absolute;
    top: 12%;
    left: 5%;
    right: 5%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
}

.battle-enemy {
    width: 90px;
    min-height: 95px;
    padding: 7px;
    text-align: center;
    border-radius: 15px;
    background: rgba(0,0,0,.28);
    border: 2px solid rgba(255,255,255,.18);
}

.battle-enemy.active {
    border-color: #ffe967;
    box-shadow: 0 0 18px rgba(255,233,103,.55);
}

.battle-enemy.dead {
    opacity: .28;
    filter: grayscale(1);
}

.enemy-visual {
    width: 43px;
    height: 43px;
    margin: auto;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.35);
}

.battle-name {
    margin-top: 4px;
    font-size: 11px;
    font-weight: bold;
}

.hp-bar,
.energy-bar {
    width: 100%;
    height: 7px;
    margin-top: 4px;
    border-radius: 8px;
    background: rgba(0,0,0,.5);
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    background: #67e36b;
}

.energy-fill {
    height: 100%;
    background: #63caff;
}

/* =====================================================
   ACTIVE PARTY
   ===================================================== */

#party {
    position: absolute;
    bottom: 225px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: center;
    gap: 7px;
}

.party-card {
    width: 105px;
    padding: 8px;
    border-radius: 14px;
    background: rgba(0,0,0,.32);
    border: 2px solid transparent;
    font-size: 10px;
}

.party-card.active {
    border-color: #ffe967;
}

.party-card.defeated {
    opacity: .35;
}

.party-name {
    font-weight: bold;
    font-size: 12px;
}

/* =====================================================
   BATTLE LOG
   ===================================================== */

#battleLog {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 105px;
    height: 105px;
    padding: 9px;
    overflow: hidden;
    border-radius: 14px;
    background: rgba(0,0,0,.55);
    font-size: 12px;
    line-height: 1.45;
}

/* =====================================================
   COMMANDS
   ===================================================== */

#commands {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 96px;
    padding: 9px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    background: rgba(8,13,9,.92);
}

.command {
    border: 0;
    border-radius: 12px;
    color: white;
    background: rgba(255,255,255,.13);
    font-weight: bold;
    font-size: 12px;
}

.command:active {
    transform: scale(.95);
}

.command:disabled {
    opacity: .3;
}

/* =====================================================
   MANAGE SQUAD
   ===================================================== */

#manage {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 500;
    background: rgba(185,220,240,.86);
    backdrop-filter: blur(16px);
    color: #19364c;
}

.manage-title {
    position: absolute;
    top: 15px;
    left: 160px;
    right: 60px;
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.manage-close {
    position: absolute;
    right: 15px;
    top: 10px;
    border: 0;
    background: rgba(255,255,255,.35);
    border-radius: 12px;
    font-size: 22px;
    padding: 6px 10px;
}

.manage-side {
    position: absolute;
    left: 0;
    top: 70px;
    bottom: 0;
    width: 145px;
    padding: 10px;
}

.manage-side button {
    width: 100%;
    margin-bottom: 8px;
    padding: 13px 8px;
    border: 0;
    border-radius: 13px;
    background: rgba(255,255,255,.32);
    color: #19364c;
    font-weight: bold;
}

.manage-main {
    position: absolute;
    left: 155px;
    top: 70px;
    right: 12px;
    bottom: 12px;
    border-radius: 22px;
    background: rgba(255,255,255,.19);
    padding: 15px;
}

.column-title {
    font-weight: bold;
    text-align: center;
    margin-bottom: 12px;
}

.squad-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(80px, 1fr));
    gap: 12px;
}

.slot {
    min-height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,.38);
    border: 2px solid rgba(255,255,255,.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 11px;
}

.roster-title {
    margin-top: 20px;
    font-weight: bold;
}

.roster {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 8px;
}

.small-slot {
    min-height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,.32);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
}

/* =====================================================
   MESSAGE
   ===================================================== */

#message {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 800;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
}

.message-card {
    width: min(88%, 420px);
    padding: 25px;
    border-radius: 22px;
    background: white;
    color: #222;
    text-align: center;
}

.message-card button {
    border: 0;
    border-radius: 12px;
    padding: 11px 25px;
    background: #222;
    color: white;
    font-weight: bold;
}

@media(max-width:600px) {

    #joystick {
        width: 125px;
        height: 125px;
    }

    #stick {
        width: 55px;
        height: 55px;
        left: 35px;
        top: 35px;
    }

    #party {
        bottom: 220px;
    }

    .party-card {
        width: 88px;
    }

    .manage-title {
        left: 145px;
        font-size: 17px;
    }

    .manage-side {
        width: 125px;
    }

    .manage-main {
        left: 130px;
    }
}
</style>
</head>

<body>

<div id="game">

<!-- ===================================================
     EXPLORATION
     =================================================== -->

<div id="world">
    <div id="worldCanvas"></div>

    <div id="player">
        <div class="player-body">
            <div class="player-eye left"></div>
            <div class="player-eye right"></div>
        </div>
    </div>
</div>

<!-- TOP UI -->

<div id="topUI">
    <div class="info">
        Hechie Lv <span id="levelText">1</span>
    </div>

    <div class="info">
        🪙 <span id="coins">50</span> DD
    </div>
</div>

<button id="manageButton">
    👥 Manage Squad
</button>

<!-- JOYSTICK -->

<div id="joystick">
    <div id="stick"></div>
</div>

<!-- ===================================================
     BATTLE
     =================================================== -->

<div id="battle">

    <div id="battleTitle">
        ⚔️ BATTLE
    </div>

    <div id="enemyFormation"></div>

    <div id="party"></div>

    <div id="battleLog">
        Battle started!
    </div>

    <div id="commands">

        <button class="command" id="attackBtn">
            ⚔️ Attack
        </button>

        <button class="command" id="abilityBtn">
            ✨ Ability
        </button>

        <button class="command" id="switchBtn">
            🔄 Switch
        </button>

        <button class="command" id="runBtn">
            🏃 Run
        </button>

    </div>

</div>

<!-- ===================================================
     MANAGE SQUAD
     =================================================== -->

<div id="manage">

    <div class="manage-title">
        MANAGE SQUAD MENU
    </div>

    <button class="manage-close"
            onclick="closeManage()">
        ❌
    </button>

    <div class="manage-side">

        <button onclick="showManageMessage(
            'ITEMS',
            'Items will allow you to heal Softoys, cure status effects and use Ability Scrolls or Intel Stones.'
        )">
            🎒 ITEMS
        </button>

        <button onclick="showManageMessage(
            'QUESTS',
            'Quest tracking will be added here. One Main Story slot and two Side Quest slots.'
        )">
            📜 QUESTS
        </button>

        <button onclick="showManageMessage(
            'ABILITIES',
            'Select a Softoy to view its natural abilities and additional ability slots.'
        )">
            ✨ ABILITIES
        </button>

    </div>

    <div class="manage-main">

        <div class="column-title">
            IN USE
        </div>

        <div class="squad-grid">

            <div class="slot">
                🟠<br>Hechie
            </div>

            <div class="slot">
                ＋ Softoy
            </div>

            <div class="slot">
                ＋ Softoy
            </div>

        </div>

        <div class="roster-title">
            REMAINING ROSTER
        </div>

        <div class="roster">

            <div class="small-slot">
                Axol
            </div>

            <div class="small-slot">
                ＋ Softoy
            </div>

            <div class="small-slot">
                ＋ Softoy
            </div>

            <div class="small-slot">
                ＋ Softoy
            </div>

            <div class="small-slot">
                ＋ Softoy
            </div>

        </div>

    </div>

</div>

<!-- ===================================================
     MESSAGE
     =================================================== -->

<div id="message">

    <div class="message-card">

        <h2 id="messageTitle">
            Message
        </h2>

        <p id="messageText"></p>

        <button onclick="closeMessage()">
            Continue
        </button>

    </div>

</div>

<script>

/* =====================================================
   SOFTOY DATABASE
   ===================================================== */

const softoyDatabase = {

    Hechie: {
        name: "Hechie",
        role: "Fighter",
        level: 1,

        maxHP: 105,
        hp: 105,

        attack: 13,
        defense: 7,
        speed: 11,

        maxEnergy: 105,
        energy: 105,

        abilities: [
            {
                name: "Fighter Strike",
                multiplier: 1.8,
                cost: 20
            }
        ],

        baseAbility: "Fighter Strike"
    },

    Axol: {
        name: "Axol",
        role: "Water Specialist",
        level: 1,

        maxHP: 90,
        hp: 90,

        attack: 9,
        defense: 6,
        speed: 14,

        maxEnergy: 130,
        energy: 130,

        abilities: [
            {
                name: "Power Spray",
                multiplier: 1.7,
                cost: 20
            }
        ],

        baseAbility: "Power Spray"
    }

};

/* =====================================================
   ACTIVE SQUAD
   ===================================================== */

let squad = [
    "Hechie",
    "Axol",
    null
];

/*
   The active Softoy is the one currently taking turns.
*/

let activeSoftoyIndex = 0;

/* =====================================================
   ENEMY DATABASE
   ===================================================== */

const enemyDatabase = {

    Grassling: {
        hp: 12,
        hpGrowth: 4,
        attack: 2,
        attackGrowth: 1,
        defense: 0,
        speed: 10,
        energy: 100,
        color: "#4d9f45",
        lootMin: 5,
        lootMax: 12
    },

    "Eddie Minion": {
        hp: 15,
        hpGrowth: 3,
        attack: 3,
        attackGrowth: 2,
        defense: 2,
        speed: 5,
        energy: 50,
        color: "#9a704e",
        lootMin: 12,
        lootMax: 20,

        abilities: [
            {
                name: "Stab",
                multiplier: 1.5,
                cost: 10
            },
            {
                name: "Full Slice",
                multiplier: 2,
                cost: 20
            }
        ]
    },

    "Armored Eddie Minion": {
        hp: 35,
        hpGrowth: 2,
        attack: 0,
        attackGrowth: 2,
        defense: 6,
        speed: 2,
        energy: 300,
        color: "#59636d",
        lootMin: 18,
        lootMax: 30,

        abilities: [
            {
                name: "Super Shield",
                multiplier: 0,
                cost: 20,
                shield: true
            }
        ]
    },

    Treepot: {
        hp: 50,
        hpGrowth: 2,
        attack: 1,
        attackGrowth: 1,
        defense: 6,
        speed: 5,
        energy: 200,
        color: "#718d46",
        lootMin: 18,
        lootMax: 35,

        abilities: [
            {
                name: "Root Growth",
                multiplier: 2.5,
                cost: 50,
                all: true
            }
        ]
    },

    Pidgeoning: {
        hp: 20,
        hpGrowth: 1,
        attack: 2,
        attackGrowth: 1,
        defense: 1,
        speed: 40,
        energy: 100,
        color: "#888",
        lootMin: 18,
        lootMax: 35,

        abilities: [
            {
                name: "Pecking Drill",
                multiplier: 4,
                cost: 50
            }
        ]
    },

    Rats: {
        hp: 10,
        hpGrowth: 1,
        attack: 1,
        attackGrowth: 1,
        defense: 0,
        speed: 30,
        energy: 50,
        color: "#665a50",
        lootMin: 2,
        lootMax: 6,

        abilities: [
            {
                name: "Rats Call",
                multiplier: 0,
                cost: 25,
                summon: true
            }
        ]
    },

    "Mimic Chest": {
        hp: 35,
        hpGrowth: 2,
        attack: 2,
        attackGrowth: 2,
        defense: 2,
        speed: 15,
        energy: 150,
        color: "#9b6b32",
        lootMin: 50,
        lootMax: 110
    }

};

/* =====================================================
   GAME STATE
   ===================================================== */

let ddCoins = 50;

let battleActive = false;

let currentEnemies = [];

let turnQueue = [];

let turnIndex = 0;

let battleTarget = null;

let pendingSwitch = false;

/* =====================================================
   WORLD ENEMIES
   ===================================================== */

const worldEnemyTypes = [
    "Grassling",
    "Eddie Minion",
    "Treepot",
    "Pidgeoning",
    "Mimic Chest",
    "Armored Eddie Minion",
    "Rats"
];

function createWorld() {

    const world =
        document.getElementById("worldCanvas");

    world.innerHTML = "";

    for (let i = 0; i < 18; i++) {

        const type =
            worldEnemyTypes[
                Math.floor(
                    Math.random() *
                    worldEnemyTypes.length
                )
            ];

        const enemy =
            document.createElement("div");

        enemy.className =
            "world-enemy";

        enemy.style.left =
            (5 + Math.random() * 88) + "%";

        enemy.style.top =
            (12 + Math.random() * 70) + "%";

        const color =
            enemyDatabase[type].color;

        enemy.innerHTML = `
            <div
                class="enemy-dot"
                style="background:${color}">
            </div>

            <div class="enemy-label">
                ${type}
            </div>
        `;

        enemy.addEventListener(
            "click",
            () => startBattle(type)
        );

        world.appendChild(enemy);
    }

    for (let i = 0; i < 80; i++) {

        const grass =
            document.createElement("div");

        grass.className = "grass";

        grass.style.left =
            Math.random() * 100 + "%";

        grass.style.top =
            Math.random() * 100 + "%";

        world.appendChild(grass);
    }
}

/* =====================================================
   CREATE ENEMY
   ===================================================== */

function createEnemy(type) {

    const base =
        enemyDatabase[type];

    const level =
        Math.floor(
            Math.random() *
            (
                getEnemyMaxLevel(type) -
                getEnemyMinLevel(type) +
                1
            )
        ) +
        getEnemyMinLevel(type);

    return {

        id: Math.random(),

        name: type,

        level: level,

        maxHP:
            base.hp +
            base.hpGrowth *
            (level - 1),

        hp:
            base.hp +
            base.hpGrowth *
            (level - 1),

        attack:
            base.attack +
            base.attackGrowth *
            (level - 1),

        defense: base.defense,

        speed: base.speed,

        maxEnergy: base.energy,

        energy: base.energy,

        color: base.color,

        lootMin: base.lootMin,

        lootMax: base.lootMax,

        abilities:
            base.abilities
                ? JSON.parse(
                    JSON.stringify(
                        base.abilities
                    )
                )
                : [],

        shield: false
    };
}

function getEnemyMinLevel(type) {

    const levels = {
        Grassling: 1,
        "Eddie Minion": 2,
        "Armored Eddie Minion": 2,
        Treepot: 4,
        Pidgeoning: 1,
        "Mimic Chest": 10,
        Rats: 1
    };

    return levels[type] || 1;
}

function getEnemyMaxLevel(type) {

    const levels = {
        Grassling: 5,
        "Eddie Minion": 8,
        "Armored Eddie Minion": 13,
        Treepot: 12,
        Pidgeoning: 8,
        "Mimic Chest": 15,
        Rats: 10
    };

    return levels[type] || 5;
}

/* =====================================================
   START BATTLE
   ===================================================== */

function startBattle(type) {

    if (battleActive) return;

    battleActive = true;

    document.getElementById("battle")
        .style.display = "block";

    currentEnemies = [];

    /*
       1–5 enemy battles.
    */

    let amount =
        Math.random() < .55
            ? 1
            : Math.floor(
                Math.random() * 4
            ) + 2;

    amount =
        Math.min(5, amount);

    for (let i = 0; i < amount; i++) {

        currentEnemies.push(
            createEnemy(type)
        );
    }

    battleTarget =
        currentEnemies[0];

    renderBattle();

    logBattle(
        `⚔️ ${amount} ${type}${amount > 1 ? "s" : ""} appeared!`
    );

    buildTurnQueue();

    setTimeout(
        processTurn,
        500
    );
}

/* =====================================================
   TURN QUEUE
   ===================================================== */

function buildTurnQueue() {

    turnQueue = [];

    const active =
        squad[activeSoftoyIndex];

    if (active) {

        const softoy =
            softoyDatabase[active];

        if (softoy.hp > 0) {

            turnQueue.push({
                type: "softoy",
                index: activeSoftoyIndex,
                speed: softoy.speed
            });
        }
    }

    currentEnemies.forEach(
        enemy => {

            if (enemy.hp > 0) {

                turnQueue.push({
                    type: "enemy",
                    enemy: enemy,
                    speed: enemy.speed
                });
            }

        }
    );

    turnQueue.sort(
        (a, b) => b.speed - a.speed
    );

    turnIndex = 0;
}

/* =====================================================
   PROCESS TURN
   ===================================================== */

function processTurn() {

    if (!battleActive) return;

    if (checkBattleEnd()) return;

    if (turnIndex >= turnQueue.length) {

        buildTurnQueue();
    }

    const actor =
        turnQueue[turnIndex];

    if (!actor) return;

    if (actor.type === "softoy") {

        const softoy =
            softoyDatabase[
                squad[actor.index]
            ];

        if (!softoy || softoy.hp <= 0) {

            turnIndex++;

            processTurn();

            return;
        }

        logBattle(
            `🟢 ${softoy.name}'s turn!`
        );

        highlightSoftoy(
            actor.index
        );

        enableCommands(true);

        return;
    }

    enableCommands(false);

    setTimeout(
        () => enemyTurn(actor.enemy),
        500
    );
}

/* =====================================================
   ATTACK
   ===================================================== */

document.getElementById("attackBtn")
.addEventListener(
    "click",
    () => {

        if (!battleActive) return;

        const softoy =
            getActiveSoftoy();

        const target =
            battleTarget &&
            battleTarget.hp > 0
                ? battleTarget
                : currentEnemies.find(
                    e => e.hp > 0
                );

        if (!softoy || !target) return;

        const damage =
            calculateDamage(
                softoy.attack,
                target.defense
            );

        target.hp =
            Math.max(
                0,
                target.hp - damage
            );

        logBattle(
            `⚔️ ${softoy.name} attacks ${target.name} for ${damage} damage!`
        );

        nextPlayerTurn();
    }
);

/* =====================================================
   ABILITY
   ===================================================== */

document.getElementById("abilityBtn")
.addEventListener(
    "click",
    () => {

        const softoy =
            getActiveSoftoy();

        if (!softoy) return;

        const ability =
            softoy.abilities[0];

        if (!ability) return;

        if (
            softoy.energy <
            ability.cost
        ) {

            logBattle(
                "⚡ Not enough Energy!"
            );

            return;
        }

        const target =
            battleTarget &&
            battleTarget.hp > 0
                ? battleTarget
                : currentEnemies.find(
                    e => e.hp > 0
                );

        if (!target) return;

        softoy.energy -=
            ability.cost;

        const damage =
            calculateDamage(
                softoy.attack *
                ability.multiplier,
                target.defense
            );

        target.hp =
            Math.max(
                0,
                target.hp - damage
            );

        logBattle(
            `✨ ${softoy.name} uses ${ability.name} for ${damage} damage!`
        );

        nextPlayerTurn();
    }
);

/* =====================================================
   SWITCH SOFTOY
   ===================================================== */

document.getElementById("switchBtn")
.addEventListener(
    "click",
    () => {

        if (!battleActive) return;

        const available =
            squad
                .map(
                    (name, index) => ({
                        name,
                        index
                    })
                )
                .filter(
                    item =>
                        item.name &&
                        softoyDatabase[item.name].hp > 0
                );

        if (available.length <= 1) {

            logBattle(
                "There are no other available Softoys!"
            );

            return;
        }

        /*
           Simple prototype switch:
           select the next available Softoy.
        */

        let next =
            (activeSoftoyIndex + 1)
            % squad.length;

        let attempts = 0;

        while (
            (
                !squad[next] ||
                softoyDatabase[
                    squad[next]
                ].hp <= 0
            ) &&
            attempts < squad.length
        ) {

            next =
                (next + 1) %
                squad.length;

            attempts++;
        }

        if (
            next ===
            activeSoftoyIndex
        ) return;

        activeSoftoyIndex = next;

        logBattle(
            `🔄 ${squad[next]} enters battle!`
        );

        renderBattle();

        nextPlayerTurn();
    }
);

/* =====================================================
   RUN
   ===================================================== */

document.getElementById("runBtn")
.addEventListener(
    "click",
    () => {

        if (!battleActive) return;

        const active =
            getActiveSoftoy();

        const fastest =
            Math.max(
                ...currentEnemies
                    .filter(
                        e => e.hp > 0
                    )
                    .map(
                        e => e.speed
                    )
            );

        let chance =
            .60 +
            (
                active.speed -
                fastest
            ) * .01;

        chance =
            Math.max(
                .20,
                Math.min(
                    .90,
                    chance
                )
            );

        if (
            Math.random() <
            chance
        ) {

            logBattle(
                "🏃 You escaped!"
            );

            setTimeout(
                endBattle,
                700
            );

        } else {

            logBattle(
                "❌ You couldn't escape!"
            );

            nextPlayerTurn();
        }
    }
);

/* =====================================================
   NEXT PLAYER TURN
   ===================================================== */

function nextPlayerTurn() {

    enableCommands(false);

    turnIndex++;

    renderBattle();

    setTimeout(
        processTurn,
        500
    );
}

/* =====================================================
   ENEMY TURN
   ===================================================== */

function enemyTurn(enemy) {

    if (!enemy || enemy.hp <= 0) {

        turnIndex++;

        processTurn();

        return;
    }

    const target =
        getActiveSoftoy();

    if (!target) return;

    let ability = null;

    if (
        enemy.abilities.length &&
        enemy.energy >=
        enemy.abilities[0].cost &&
        Math.random() < .55
    ) {

        ability =
            enemy.abilities[
                Math.floor(
                    Math.random() *
                    enemy.abilities.length
                )
            ];
    }

    if (ability) {

        enemy.energy -=
            ability.cost;

        if (ability.shield) {

            enemy.shield = true;

            logBattle(
                `🛡️ ${enemy.name} activates Super Shield!`
            );

        } else if (ability.summon) {

            if (
                currentEnemies.length <
                5
            ) {

                const newRat =
                    createEnemy("Rats");

                currentEnemies.push(
                    newRat
                );

                logBattle(
                    `🐀 ${enemy.name} calls another Rat!`
                );

            } else {

                logBattle(
                    `🐀 ${enemy.name} tries Rats Call, but there is no room!`
                );
            }

        } else if (ability.all) {

            const damage =
                calculateDamage(
                    enemy.attack *
                    ability.multiplier,
                    target.defense
                );

            /*
               Prototype currently has
               one active Softoy at a time,
               so this applies to the active
               Softoy.
            */

            target.hp =
                Math.max(
                    0,
                    target.hp - damage
                );

            logBattle(
                `🌳 ${enemy.name} uses ${ability.name} for ${damage} damage!`
            );

        } else {

            let damage =
                calculateDamage(
                    enemy.attack *
                    ability.multiplier,
                    target.defense
                );

            if (enemy.shield) {

                damage =
                    Math.max(
                        1,
                        Math.floor(
                            damage * .05
                        )
                    );

                enemy.shield = false;
            }

            target.hp =
                Math.max(
                    0,
                    target.hp - damage
                );

            logBattle(
                `💥 ${enemy.name} uses ${ability.name} for ${damage} damage!`
            );
        }

    } else {

        let damage =
            calculateDamage(
                enemy.attack,
                target.defense
            );

        if (enemy.shield) {

            damage =
                Math.max(
                    1,
                    Math.floor(
                        damage * .05
                    )
                );

            enemy.shield = false;

            logBattle(
                `🛡️ Super Shield blocks most of the attack!`
            );
        }

        target.hp =
            Math.max(
                0,
                target.hp - damage
            );

        logBattle(
            `💥 ${enemy.name} attacks ${target.name} for ${damage} damage!`
        );
    }

    renderBattle();

    if (checkBattleEnd()) return;

    turnIndex++;

    setTimeout(
        processTurn,
        600
    );
}

/* =====================================================
   DAMAGE
   ===================================================== */

function calculateDamage(
    attack,
    defense
) {

    return Math.max(
        1,
        Math.floor(
            attack - defense
        )
    );
}

/* =====================================================
   GET ACTIVE SOFTOY
   ===================================================== */

function getActiveSoftoy() {

    const name =
        squad[
            activeSoftoyIndex
        ];

    return name
        ? softoyDatabase[name]
        : null;
}

/* =====================================================
   BATTLE END
   ===================================================== */

function checkBattleEnd() {

    const livingEnemies =
        currentEnemies.filter(
            e => e.hp > 0
        );

    const livingSoftoys =
        squad.filter(
            name =>
                name &&
                softoyDatabase[name].hp > 0
        );

    if (
        livingSoftoys.length === 0
    ) {

        showMessage(
            "Defeat",
            "All of your Softoys have been defeated."
        );

        return true;
    }

    if (
        livingEnemies.length === 0
    ) {

        let reward = 0;
        let totalEXP = 0;

        currentEnemies.forEach(
            enemy => {

                reward +=
                    Math.floor(
                        Math.random() *
                        (
                            enemy.lootMax -
                            enemy.lootMin +
                            1
                        )
                    ) +
                    enemy.lootMin;

                totalEXP +=
                    enemy.level * 8;
            }
        );

        ddCoins += reward;

        /*
           EXP is currently displayed
           as a prototype reward.
        */

        showMessage(
            "Victory! 🎉",
            `The enemies were defeated!\n\n+${reward} DD-coins\n+${totalEXP} EXP`
        );

        return true;
    }

    return false;
}

/* =====================================================
   END BATTLE
   ===================================================== */

function endBattle() {

    battleActive = false;

    document.getElementById("battle")
        .style.display = "none";

    enableCommands(true);

    currentEnemies = [];

    renderBattle();

    updateTopUI();
}

/* =====================================================
   RENDER BATTLE
   ===================================================== */

function renderBattle() {

    const formation =
        document.getElementById(
            "enemyFormation"
        );

    formation.innerHTML = "";

    currentEnemies.forEach(
        enemy => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "battle-enemy";

            if (enemy.hp <= 0) {
                card.classList.add(
                    "dead"
                );
            }

            if (
                battleTarget &&
                enemy.id ===
                battleTarget.id
            ) {

                card.classList.add(
                    "active"
                );
            }

            card.addEventListener(
                "click",
                () => {

                    if (
                        enemy.hp > 0
                    ) {

                        battleTarget =
                            enemy;

                        renderBattle();
                    }
                }
            );

            const hpPercent =
                Math.max(
                    0,
                    enemy.hp /
                    enemy.maxHP *
                    100
                );

            card.innerHTML = `

                <div
                    class="enemy-visual"
                    style="background:${enemy.color}">
                </div>

                <div class="battle-name">
                    ${enemy.name}
                </div>

                <div>
                    Lv ${enemy.level}
                </div>

                <div class="hp-bar">
                    <div
                        class="hp-fill"
                        style="width:${hpPercent}%">
                    </div>
                </div>

                <div style="font-size:9px;">
                    ${enemy.hp}/${enemy.maxHP}
                </div>
            `;

            formation.appendChild(
                card
            );
        }
    );

    renderParty();

    updateTopUI();
}

/* =====================================================
   PARTY DISPLAY
   ===================================================== */

function renderParty() {

    const party =
        document.getElementById(
            "party"
        );

    party.innerHTML = "";

    squad.forEach(
        (name, index) => {

            if (!name) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "party-card";

                empty.innerHTML =
                    "＋ Softoy";

                party.appendChild(
                    empty
                );

                return;
            }

            const softoy =
                softoyDatabase[name];

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "party-card";

            if (
                index ===
                activeSoftoyIndex
            ) {

                card.classList.add(
                    "active"
                );
            }

            if (
                softoy.hp <= 0
            ) {

                card.classList.add(
                    "defeated"
                );
            }

            card.innerHTML = `

                <div class="party-name">
                    ${name}
                </div>

                <div>
                    Lv ${softoy.level}
                </div>

                <div>
                    ❤️ ${softoy.hp}/${softoy.maxHP}
                </div>

                <div class="hp-bar">
                    <div
                        class="hp-fill"
                        style="width:${
                            Math.max(
                                0,
                                softoy.hp /
                                softoy.maxHP *
                                100
                            )
                        }%">
                    </div>
                </div>

                <div>
                    ⚡ ${softoy.energy}/${softoy.maxEnergy}
                </div>

                <div class="energy-bar">
                    <div
                        class="energy-fill"
                        style="width:${
                            Math.max(
                                0,
                                softoy.energy /
                                softoy.maxEnergy *
                                100
                            )
                        }%">
                    </div>
                </div>
            `;

            /*
               Tapping a living party member
               switches to that Softoy.
            */

            card.addEventListener(
                "click",
                () => {

                    if (
                        battleActive &&
                        softoy.hp > 0 &&
                        index !==
                        activeSoftoyIndex
                    ) {

                        activeSoftoyIndex =
                            index;

                        logBattle(
                            `🔄 ${name} is now active!`
                        );

                        renderBattle();
                    }
                }
            );

            party.appendChild(
                card
            );
        }
    );
}

/* =====================================================
   BATTLE LOG
   ===================================================== */

function logBattle(text) {

    const log =
        document.getElementById(
            "battleLog"
        );

    const line =
        document.createElement(
            "div"
        );

    line.textContent = text;

    log.appendChild(
        line
    );

    while (
        log.children.length > 6
    ) {

        log.removeChild(
            log.firstChild
        );
    }

    log.scrollTop =
        log.scrollHeight;
}

/* =====================================================
   HIGHLIGHT ACTIVE SOFTOY
   ===================================================== */

function highlightSoftoy(index) {

    const cards =
        document.querySelectorAll(
            ".party-card"
        );

    cards.forEach(
        (card, i) => {

            card.classList.toggle(
                "active",
                i === index
            );
        }
    );
}

/* =====================================================
   COMMANDS
   ===================================================== */

function enableCommands(enabled) {

    document
        .querySelectorAll(
            ".command"
        )
        .forEach(
            button => {
                button.disabled =
                    !enabled;
            }
        );
}

/* =====================================================
   MANAGE SQUAD
   ===================================================== */

document.getElementById(
    "manageButton"
).addEventListener(
    "click",
    () => {

        if (battleActive) return;

        document.getElementById(
            "manage"
        ).style.display = "block";
    }
);

function closeManage() {

    document.getElementById(
        "manage"
    ).style.display = "none";
}

function showManageMessage(
    title,
    text
) {

    showMessage(
        title,
        text
    );
}

/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
    title,
    text
) {

    document.getElementById(
        "messageTitle"
    ).textContent = title;

    document.getElementById(
        "messageText"
    ).textContent = text;

    document.getElementById(
        "message"
    ).style.display = "flex";

    enableCommands(false);
}

function closeMessage() {

    document.getElementById(
        "message"
    ).style.display = "none";

    if (
        !battleActive
    ) {

        updateTopUI();

        return;
    }

    /*
       Defeat:
       restore half HP for testing.
    */

    if (
        squad.every(
            name =>
                !name ||
                softoyDatabase[name].hp <= 0
        )
    ) {

        squad.forEach(
            name => {

                if (name) {

                    const softoy =
                        softoyDatabase[name];

                    softoy.hp =
                        Math.floor(
                            softoy.maxHP *
                            .5
                        );

                    softoy.energy =
                        softoy.maxEnergy;
                }
            }
        );
    }

    endBattle();
}

/* =====================================================
   TOP UI
   ===================================================== */

function updateTopUI() {

    const he =
        softoyDatabase.Hechie;

    document.getElementById(
        "levelText"
    ).textContent =
        he.level;

    document.getElementById(
        "coins"
    ).textContent =
        ddCoins;
}

/* =====================================================
   JOYSTICK
   ===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive = false;

let centerX = 0;
let centerY = 0;
let radius = 0;

let playerX = 0;
let playerY = 0;

function setupJoystick() {

    const rect =
        joystick.getBoundingClientRect();

    centerX =
        rect.left +
        rect.width / 2;

    centerY =
        rect.top +
        rect.height / 2;

    radius =
        rect.width / 2 -
        30;
}

function moveJoystick(
    x,
    y
) {

    const dx =
        x - centerX;

    const dy =
        y - centerY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(
            dy,
            dx
        );

    const limited =
        Math.min(
            distance,
            radius
        );

    const sx =
        Math.cos(angle) *
        limited;

    const sy =
        Math.sin(angle) *
        limited;

    stick.style.transform =
        `translate(${sx}px,${sy}px)`;

    if (battleActive)
        return;

    const strength =
        limited / radius;

    playerX +=
        sx / radius *
        2.7 *
        strength;

    playerY +=
        sy / radius *
        2.7 *
        strength;

    playerX =
        Math.max(
            -45,
            Math.min(
                45,
                playerX
            )
        );

    playerY =
        Math.max(
            -35,
            Math.min(
                35,
                playerY
            )
        );

    document.getElementById(
        "worldCanvas"
    ).style.transform =
        `translate(${-playerX * 5}px,${-playerY * 5}px)`;
}

function resetJoystick() {

    joystickActive = false;

    stick.style.transform =
        "translate(0,0)";
}

joystick.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        setupJoystick();

        joystickActive = true;

        const t =
            e.touches[0];

        moveJoystick(
            t.clientX,
            t.clientY
        );
    },
    { passive:false }
);

joystick.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        if (!joystickActive)
            return;

        const t =
            e.touches[0];

        moveJoystick(
            t.clientX,
            t.clientY
        );
    },
    { passive:false }
);

joystick.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        resetJoystick();
    },
    { passive:false }
);

/* Mouse support */

joystick.addEventListener(
    "mousedown",
    e => {

        setupJoystick();

        joystickActive = true;

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "mousemove",
    e => {

        if (!joystickActive)
            return;

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "mouseup",
    resetJoystick
);

/* =====================================================
   INITIALIZE
   ===================================================== */

createWorld();

updateTopUI();

setupJoystick();

window.addEventListener(
    "resize",
    setupJoystick
);

</script>
