<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Softoy RPG - Prototype 2</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(#9bd86b 0%, #83c957 55%, #6bb247 100%);
}

/* =====================================================
   WORLD
   ===================================================== */

#world {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#worldCanvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Decorative grass */
.grass {
    position: absolute;
    width: 4px;
    height: 13px;
    background: #5b9d3b;
    border-radius: 4px;
    opacity: .7;
}

/* =====================================================
   PLAYER
   ===================================================== */

#player {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    transform: translate(-50%, -50%);
    z-index: 20;
    transition: transform .05s linear;
}

.player-body {
    width: 58px;
    height: 58px;
    border-radius: 48% 48% 42% 42%;
    background: #f2c89f;
    border: 4px solid #5a3827;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    position: relative;
}

.player-eye {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #111;
    border-radius: 50%;
    top: 17px;
}

.player-eye.left {
    left: 14px;
}

.player-eye.right {
    right: 14px;
}

.player-mouth {
    position: absolute;
    width: 14px;
    height: 7px;
    border-bottom: 3px solid #5a3827;
    border-radius: 50%;
    left: 18px;
    top: 32px;
}

/* =====================================================
   ENEMIES IN WORLD
   ===================================================== */

.world-enemy {
    position: absolute;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.enemy-dot {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(0,0,0,.35);
    box-shadow: 0 4px 7px rgba(0,0,0,.18);
}

.enemy-label {
    position: absolute;
    top: 44px;
    white-space: nowrap;
    font-size: 10px;
    font-weight: bold;
    color: #17320f;
    text-shadow: 0 1px white;
}

/* =====================================================
   JOYSTICK
   ===================================================== */

#joystick {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.35);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    box-shadow:
        inset 0 0 25px rgba(255,255,255,.08),
        0 8px 25px rgba(0,0,0,.15);
}

#stick {
    position: absolute;
    width: 62px;
    height: 62px;
    left: 41px;
    top: 41px;
    border-radius: 50%;
    background: rgba(255,255,255,.52);
    border: 2px solid rgba(255,255,255,.7);
    box-shadow:
        0 5px 15px rgba(0,0,0,.2),
        inset 0 0 12px rgba(255,255,255,.35);
}

/* =====================================================
   TOP UI
   ===================================================== */

#topUI {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 80;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.info-box {
    background: rgba(20,30,20,.72);
    color: white;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    backdrop-filter: blur(8px);
}

#coins {
    font-weight: bold;
}

/* =====================================================
   BATTLE SCREEN
   ===================================================== */

#battle {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 200;
    background:
        radial-gradient(circle at center, #6d9c55 0%, #456e3c 45%, #263c28 100%);
    color: white;
}

#battleArena {
    position: absolute;
    inset: 0;
}

#battleTitle {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: bold;
    background: rgba(0,0,0,.45);
    padding: 9px 18px;
    border-radius: 14px;
    z-index: 5;
}

#enemyFormation {
    position: absolute;
    top: 14%;
    left: 50%;
    width: 90%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.battle-enemy {
    width: 95px;
    min-height: 90px;
    background: rgba(0,0,0,.28);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 16px;
    padding: 7px;
    text-align: center;
    position: relative;
}

.battle-enemy.active {
    border-color: #ffe96b;
    box-shadow: 0 0 18px rgba(255,230,80,.5);
}

.battle-enemy.dead {
    opacity: .28;
    filter: grayscale(1);
}

.enemy-visual {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    margin: 0 auto 4px;
    border: 3px solid rgba(0,0,0,.35);
}

.battle-name {
    font-size: 12px;
    font-weight: bold;
}

.hp-bar {
    width: 100%;
    height: 7px;
    background: rgba(0,0,0,.5);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

.hp-fill {
    height: 100%;
    background: #68e36c;
    width: 100%;
}

#party {
    position: absolute;
    bottom: 205px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.party-member {
    width: 105px;
    background: rgba(0,0,0,.3);
    border-radius: 14px;
    padding: 8px;
    font-size: 11px;
}

.party-member .name {
    font-weight: bold;
}

.energy-bar {
    height: 6px;
    background: rgba(0,0,0,.5);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
}

.energy-fill {
    height: 100%;
    background: #65caff;
}

/* =====================================================
   BATTLE LOG
   ===================================================== */

#battleLog {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 108px;
    height: 82px;
    overflow: hidden;
    background: rgba(0,0,0,.55);
    border-radius: 14px;
    padding: 9px;
    font-size: 12px;
    line-height: 1.4;
}

/* =====================================================
   BATTLE COMMANDS
   ===================================================== */

#commands {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 100px;
    background: rgba(10,15,10,.9);
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.command {
    border: 0;
    border-radius: 12px;
    background: rgba(255,255,255,.14);
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding: 12px 5px;
}

.command:active {
    transform: scale(.95);
    background: rgba(255,255,255,.25);
}

.command:disabled {
    opacity: .35;
}

/* =====================================================
   MODAL
   ===================================================== */

#message {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 500;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.55);
}

.message-card {
    width: min(88%, 430px);
    background: white;
    color: #222;
    border-radius: 22px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

.message-card h2 {
    margin-top: 0;
}

.message-card button {
    margin-top: 15px;
    border: 0;
    border-radius: 12px;
    padding: 12px 25px;
    background: #222;
    color: white;
    font-weight: bold;
}

/* =====================================================
   SMALL SCREENS
   ===================================================== */

@media (max-width: 600px) {
    #joystick {
        width: 125px;
        height: 125px;
    }

    #stick {
        width: 55px;
        height: 55px;
        left: 35px;
        top: 35px;
    }

    #party {
        bottom: 215px;
    }

    .party-member {
        width: 86px;
        font-size: 10px;
    }

    #commands {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<div id="game">

    <!-- =================================================
         EXPLORATION WORLD
         ================================================= -->

    <div id="world">

        <div id="worldCanvas"></div>

        <div id="player">
            <div class="player-body">
                <div class="player-eye left"></div>
                <div class="player-eye right"></div>
                <div class="player-mouth"></div>
            </div>
        </div>

    </div>

    <!-- =================================================
         TOP UI
         ================================================= -->

    <div id="topUI">
        <div class="info-box">
            Hechie Lv <span id="levelText">1</span>
        </div>

        <div class="info-box">
            ❤️ <span id="hpText">105</span>
        </div>

        <div class="info-box">
            🪙 <span id="coins">50</span> DD
        </div>
    </div>

    <!-- =================================================
         JOYSTICK
         ================================================= -->

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <!-- =================================================
         BATTLE
         ================================================= -->

    <div id="battle">

        <div id="battleTitle">
            BATTLE
        </div>

        <div id="enemyFormation"></div>

        <div id="party"></div>

        <div id="battleLog">
            A battle has started!
        </div>

        <div id="commands">

            <button class="command" id="attackBtn">
                ⚔️ Attack
            </button>

            <button class="command" id="abilityBtn">
                ✨ Ability
            </button>

            <button class="command" id="itemBtn">
                🎒 Item
            </button>

            <button class="command" id="runBtn">
                🏃 Run
            </button>

        </div>

    </div>

    <!-- =================================================
         MESSAGE
         ================================================= -->

    <div id="message">

        <div class="message-card">

            <h2 id="messageTitle">
                Victory!
            </h2>

            <p id="messageText"></p>

            <button onclick="closeMessage()">
                Continue
            </button>

        </div>

    </div>

</div>

<script>

/* =====================================================
   HECHIE
   ===================================================== */

const hechie = {
    name: "Hechie",
    level: 1,
    maxHP: 105,
    hp: 105,
    attack: 13,
    defense: 7,
    speed: 11,
    maxEnergy: 105,
    energy: 105
};

/* =====================================================
   GAME STATE
   ===================================================== */

let ddCoins = 50;

let playerX = 0;
let playerY = 0;

let joystickActive = false;

let battleActive = false;

let currentEnemies = [];

let turnQueue = [];
let currentTurnIndex = 0;

let battleTarget = null;

/* =====================================================
   ENEMY DATABASE
   ===================================================== */

const enemyDatabase = {

    Grassling: {
        name: "Grassling",
        minLevel: 1,
        maxLevel: 5,
        hp: 12,
        hpGrowth: 4,
        attack: 2,
        attackGrowth: 1,
        defense: 0,
        speed: 10,
        energy: 100,
        ai: "defense",
        rarity: "Common",
        lootMin: 5,
        lootMax: 12,
        color: "#4d9f45",

        abilities: [
            {
                name: "Blade Cut",
                multiplier: 1.8,
                cost: 10,
                target: "single"
            }
        ]
    },

    "Eddie Minion": {
        name: "Eddie Minion",
        minLevel: 2,
        maxLevel: 8,
        hp: 15,
        hpGrowth: 3,
        attack: 3,
        attackGrowth: 2,
        defense: 2,
        speed: 5,
        energy: 50,
        ai: "attack",
        rarity: "Rare",
        lootMin: 12,
        lootMax: 20,
        color: "#9a704e",

        abilities: [
            {
                name: "Stab",
                multiplier: 1.5,
                cost: 10,
                target: "single",
                chance: .80
            },
            {
                name: "Full Slice",
                multiplier: 2.0,
                cost: 20,
                target: "single",
                chance: .20
            }
        ]
    },

    "Green Grudger": {
        name: "Green Grudger",
        minLevel: 35,
        maxLevel: 50,
        hp: 13,
        hpGrowth: 1,
        attack: 3,
        attackGrowth: 2,
        defense: 15,
        speed: 25,
        energy: 220,
        ai: "mixed",
        rarity: "Common",
        lootMin: 120,
        lootMax: 305,
        color: "#174d28",

        abilities: [
            {
                name: "Claw In",
                multiplier: 2.0,
                cost: 30,
                target: "single",
                chance: .40
            },
            {
                name: "Grudge",
                multiplier: 0,
                cost: 50,
                target: "single",
                chance: .60,
                special: "grudge"
            }
        ]
    },

    Treepot: {
        name: "Treepot",
        minLevel: 4,
        maxLevel: 12,
        hp: 50,
        hpGrowth: 2,
        attack: 1,
        attackGrowth: 1,
        defense: 6,
        speed: 5,
        energy: 200,
        ai: "defense",
        rarity: "Uncommon",
        lootMin: 18,
        lootMax: 35,
        color: "#718d46",

        abilities: [
            {
                name: "Root Growth",
                multiplier: 2.5,
                cost: 50,
                target: "all"
            }
        ]
    },

    Pidgeoning: {
        name: "Pidgeoning",
        minLevel: 1,
        maxLevel: 8,
        hp: 20,
        hpGrowth: 1,
        attack: 2,
        attackGrowth: 1,
        defense: 1,
        speed: 40,
        energy: 100,
        ai: "smart",
        rarity: "Uncommon",
        lootMin: 18,
        lootMax: 35,
        color: "#8a8a8a",

        abilities: [
            {
                name: "Pecking Drill",
                multiplier: 4,
                cost: 50,
                target: "single"
            }
        ]
    },

    "Mimic Chest": {
        name: "Mimic Chest",
        minLevel: 10,
        maxLevel: 15,
        hp: 35,
        hpGrowth: 2,
        attack: 2,
        attackGrowth: 2,
        defense: 2,
        speed: 15,
        energy: 150,
        ai: "smart",
        rarity: "Super Rare",
        lootMin: 50,
        lootMax: 110,
        color: "#9b6b32",

        abilities: [
            {
                name: "Mimicer",
                multiplier: 1.5,
                cost: 75,
                target: "single",
                special: "mimic"
            }
        ]
    },

    "Armored Eddie Minion": {
        name: "Armored Eddie Minion",
        minLevel: 2,
        maxLevel: 13,
        hp: 35,
        hpGrowth: 2,
        attack: 0,
        attackGrowth: 2,
        defense: 6,
        speed: 2,
        energy: 300,
        ai: "attack",
        rarity: "Rare",
        lootMin: 18,
        lootMax: 30,
        color: "#59636d",

        abilities: [
            {
                name: "Super Shield",
                multiplier: 0,
                cost: 20,
                target: "self",
                special: "shield"
            }
        ]
    },

    Rats: {
        name: "Rats",
        minLevel: 1,
        maxLevel: 10,
        hp: 10,
        hpGrowth: 1,
        attack: 1,
        attackGrowth: 1,
        defense: 0,
        speed: 30,
        energy: 50,
        ai: "mixed",
        rarity: "Common",
        lootMin: 2,
        lootMax: 6,
        color: "#665a50",

        abilities: [
            {
                name: "Rats Call",
                multiplier: 0,
                cost: 25,
                target: "self",
                special: "summon"
            }
        ]
    }

};

/* =====================================================
   WORLD ENEMIES
   ===================================================== */

const worldEnemyTypes = [
    "Grassling",
    "Eddie Minion",
    "Treepot",
    "Pidgeoning",
    "Mimic Chest",
    "Armored Eddie Minion",
    "Rats"
];

function createWorldEnemies() {

    const world = document.getElementById("worldCanvas");

    world.innerHTML = "";

    for (let i = 0; i < 15; i++) {

        const type =
            worldEnemyTypes[
                Math.floor(Math.random() * worldEnemyTypes.length)
            ];

        const data = enemyDatabase[type];

        const enemy = document.createElement("div");

        enemy.className = "world-enemy";

        enemy.style.left =
            (8 + Math.random() * 84) + "%";

        enemy.style.top =
            (15 + Math.random() * 65) + "%";

        enemy.dataset.enemy = type;

        enemy.innerHTML = `
            <div
                class="enemy-dot"
                style="background:${data.color}">
            </div>

            <div class="enemy-label">
                ${type}
            </div>
        `;

        enemy.addEventListener("click", () => {

            if (!battleActive) {
                startBattle(type);
            }

        });

        world.appendChild(enemy);
    }

    /* Grass decoration */

    for (let i = 0; i < 70; i++) {

        const grass = document.createElement("div");

        grass.className = "grass";

        grass.style.left =
            Math.random() * 100 + "%";

        grass.style.top =
            Math.random() * 100 + "%";

        world.appendChild(grass);
    }
}

/* =====================================================
   CREATE ENEMY
   ===================================================== */

function createEnemy(type, level) {

    const base = enemyDatabase[type];

    const enemy = {

        id: Math.random(),

        name: base.name,

        level: level,

        maxHP:
            base.hp +
            base.hpGrowth * (level - 1),

        hp:
            base.hp +
            base.hpGrowth * (level - 1),

        attack:
            base.attack +
            base.attackGrowth * (level - 1),

        defense: base.defense,

        speed: base.speed,

        maxEnergy: base.energy,

        energy: base.energy,

        ai: base.ai,

        rarity: base.rarity,

        lootMin: base.lootMin,

        lootMax: base.lootMax,

        abilities:
            JSON.parse(JSON.stringify(base.abilities)),

        shield: false,

        grudge: false
    };

    return enemy;
}

/* =====================================================
   RANDOM LEVEL
   ===================================================== */

function randomEnemyLevel(type) {

    const base = enemyDatabase[type];

    return Math.floor(
        Math.random() *
        (base.maxLevel - base.minLevel + 1)
    ) + base.minLevel;
}

/* =====================================================
   BATTLE START
   ===================================================== */

function startBattle(type) {

    battleActive = true;

    document.getElementById("battle").style.display = "block";

    /*
       Usually 1–5 enemies.
       For the prototype, most battles are 1–3.
    */

    let count =
        Math.random() < .65
            ? 1
            : Math.floor(Math.random() * 4) + 1;

    currentEnemies = [];

    for (let i = 0; i < count; i++) {

        let enemyType = type;

        /*
           Rats can create rat groups.
        */

        if (type === "Rats") {
            enemyType = "Rats";
        }

        currentEnemies.push(
            createEnemy(
                enemyType,
                randomEnemyLevel(enemyType)
            )
        );
    }

    battleTarget = currentEnemies[0];

    renderBattle();

    logBattle(
        `⚔️ ${currentEnemies.length} enemy${currentEnemies.length > 1 ? "ies" : ""} appeared!`
    );

    buildTurnOrder();

    setTimeout(() => {
        processTurns();
    }, 500);
}

/* =====================================================
   TURN ORDER
   ===================================================== */

function buildTurnOrder() {

    turnQueue = [
        {
            type: "player",
            name: "Hechie",
            speed: hechie.speed
        }
    ];

    currentEnemies.forEach(enemy => {

        if (enemy.hp > 0) {

            turnQueue.push({
                type: "enemy",
                enemy: enemy,
                name: enemy.name,
                speed: enemy.speed
            });

        }

    });

    /*
       Highest speed first.
       If equal speed, Hechie/player gets priority,
       followed by enemy order.
    */

    turnQueue.sort((a, b) => {

        if (b.speed !== a.speed) {
            return b.speed - a.speed;
        }

        if (a.type === "player") return -1;
        if (b.type === "player") return 1;

        return 0;
    });

    currentTurnIndex = 0;
}

/* =====================================================
   PROCESS TURNS
   ===================================================== */

function processTurns() {

    if (!battleActive) return;

    if (checkBattleEnd()) return;

    if (currentTurnIndex >= turnQueue.length) {

        buildTurnOrder();

    }

    const actor = turnQueue[currentTurnIndex];

    if (!actor) return;

    if (
        actor.type === "enemy" &&
        actor.enemy.hp <= 0
    ) {

        currentTurnIndex++;

        setTimeout(processTurns, 200);

        return;
    }

    if (actor.type === "player") {

        logBattle(
            "🟢 Hechie's turn!"
        );

        enableCommands(true);

        highlightTurn("player");

        return;

    }

    enableCommands(false);

    highlightTurn(actor.enemy.id);

    setTimeout(() => {

        enemyTakeTurn(actor.enemy);

    }, 700);
}

/* =====================================================
   PLAYER ATTACK
   ===================================================== */

document.getElementById("attackBtn")
.addEventListener("click", () => {

    if (!battleActive) return;

    const target =
        currentEnemies.find(e => e.hp > 0);

    if (!target) return;

    const damage =
        calculateDamage(
            hechie.attack,
            target.defense
        );

    target.hp =
        Math.max(0, target.hp - damage);

    logBattle(
        `⚔️ Hechie attacks ${target.name} for ${damage} damage!`
    );

    animateEnemy(target.id);

    finishPlayerTurn();

});

/* =====================================================
   ABILITY
   ===================================================== */

document.getElementById("abilityBtn")
.addEventListener("click", () => {

    if (!battleActive) return;

    if (hechie.energy < 25) {

        logBattle(
            "⚡ Not enough Energy!"
        );

        return;
    }

    const target =
        currentEnemies.find(e => e.hp > 0);

    if (!target) return;

    hechie.energy -= 25;

    const raw =
        hechie.attack * 2;

    const damage =
        calculateDamage(
            raw,
            target.defense
        );

    target.hp =
        Math.max(0, target.hp - damage);

    logBattle(
        `✨ Hechie uses Power Strike on ${target.name} for ${damage} damage!`
    );

    animateEnemy(target.id);

    finishPlayerTurn();

});

/* =====================================================
   ITEMS
   ===================================================== */

document.getElementById("itemBtn")
.addEventListener("click", () => {

    if (!battleActive) return;

    if (ddCoins < 10) {

        logBattle(
            "🪙 You don't have enough DD-coins for a test potion."
        );

        return;
    }

    ddCoins -= 10;

    const heal = 50;

    hechie.hp =
        Math.min(
            hechie.maxHP,
            hechie.hp + heal
        );

    logBattle(
        `🧪 Health Potion restored ${heal} HP!`
    );

    updateTopUI();

    finishPlayerTurn();

});

/* =====================================================
   RUN
   ===================================================== */

document.getElementById("runBtn")
.addEventListener("click", () => {

    if (!battleActive) return;

    /*
       Speed-based escape chance.
    */

    const fastestEnemy =
        Math.max(
            ...currentEnemies
                .filter(e => e.hp > 0)
                .map(e => e.speed)
        );

    let chance =
        .60 +
        (hechie.speed - fastestEnemy) * .01;

    chance =
        Math.max(.20, Math.min(.90, chance));

    if (Math.random() < chance) {

        logBattle(
            "🏃 You escaped!"
        );

        setTimeout(endBattle, 700);

    } else {

        logBattle(
            "❌ You couldn't escape!"
        );

        finishPlayerTurn();

    }

});

/* =====================================================
   FINISH PLAYER TURN
   ===================================================== */

function finishPlayerTurn() {

    enableCommands(false);

    currentTurnIndex++;

    renderBattle();

    setTimeout(() => {

        if (!checkBattleEnd()) {
            processTurns();
        }

    }, 500);
}

/* =====================================================
   ENEMY TURN
   ===================================================== */

function enemyTakeTurn(enemy) {

    if (enemy.hp <= 0) {

        currentTurnIndex++;

        processTurns();

        return;
    }

    let ability = chooseEnemyAbility(enemy);

    if (
        ability &&
        enemy.energy >= ability.cost
    ) {

        enemy.energy -= ability.cost;

        useEnemyAbility(enemy, ability);

    } else {

        enemyBasicAttack(enemy);

    }

    renderBattle();

    if (checkBattleEnd()) return;

    currentTurnIndex++;

    setTimeout(() => {

        processTurns();

    }, 700);
}

/* =====================================================
   CHOOSE ENEMY ABILITY
   ===================================================== */

function chooseEnemyAbility(enemy) {

    if (!enemy.abilities.length) return null;

    const ability =
        enemy.abilities[
            Math.floor(
                Math.random() *
                enemy.abilities.length
            )
        ];

    /*
       Attack AI strongly favours attacking.
    */

    if (enemy.ai === "attack") {

        if (Math.random() < .65) {
            return ability;
        }

    }

    if (enemy.ai === "defense") {

        if (Math.random() < .55) {
            return ability;
        }

    }

    if (enemy.ai === "mixed") {

        if (Math.random() < .50) {
            return ability;
        }

    }

    if (enemy.ai === "smart") {

        /*
           Basic Smart AI based on HP.
        */

        const hpPercent =
            enemy.hp / enemy.maxHP;

        if (hpPercent > .65) {

            return Math.random() < .5
                ? null
                : ability;

        }

        if (hpPercent > .30) {

            return ability;

        }

        return Math.random() < .5
            ? ability
            : null;
    }

    return null;
}

/* =====================================================
   ENEMY ABILITY
   ===================================================== */

function useEnemyAbility(enemy, ability) {

    if (ability.special === "shield") {

        enemy.shield = true;

        logBattle(
            `🛡️ ${enemy.name} uses Super Shield!`
        );

        return;
    }

    if (ability.special === "grudge") {

        enemy.grudge = true;

        logBattle(
            `🟢 ${enemy.name} uses GRUDGE!`
        );

        return;
    }

    if (ability.special === "summon") {

        if (currentEnemies.length >= 5) {

            logBattle(
                `🐀 ${enemy.name} tries to call more Rats, but there is no room!`
            );

            return;
        }

        const amount =
            Math.random() < .5 ? 1 : 2;

        let added = 0;

        for (let i = 0; i < amount; i++) {

            if (currentEnemies.length >= 5)
                break;

            currentEnemies.push(
                createEnemy(
                    "Rats",
                    randomEnemyLevel("Rats")
                )
            );

            added++;
        }

        logBattle(
            `🐀 Rats Call summoned ${added} more Rat${added > 1 ? "s" : ""}!`
        );

        return;
    }

    if (ability.special === "mimic") {

        const available = [
            {
                name: "Power Strike",
                multiplier: 1.5
            },
            {
                name: "Quick Strike",
                multiplier: 1.5
            }
        ];

        const copied =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];

        const damage =
            calculateDamage(
                enemy.attack *
                copied.multiplier,
                hechie.defense
            );

        hechie.hp =
            Math.max(
                0,
                hechie.hp - damage
            );

        logBattle(
            `🧰 ${enemy.name} copies ${copied.name} and deals ${damage} damage!`
        );

        return;
    }

    /* Normal ability */

    if (ability.target === "all") {

        const raw =
            enemy.attack *
            ability.multiplier;

        const damage =
            calculateDamage(
                raw,
                hechie.defense
            );

        hechie.hp =
            Math.max(
                0,
                hechie.hp - damage
            );

        logBattle(
            `🌳 ${enemy.name} uses ${ability.name}! All Softoys are hit for ${damage} damage!`
        );

        return;
    }

    const damage =
        calculateDamage(
            enemy.attack *
            ability.multiplier,
            hechie.defense
        );

    hechie.hp =
        Math.max(
            0,
            hechie.hp - damage
        );

    logBattle(
        `💥 ${enemy.name} uses ${ability.name} for ${damage} damage!`
    );
}

/* =====================================================
   BASIC ENEMY ATTACK
   ===================================================== */

function enemyBasicAttack(enemy) {

    let damage =
        calculateDamage(
            enemy.attack,
            hechie.defense
        );

    if (enemy.shield) {

        damage =
            Math.max(
                1,
                Math.floor(damage * .05)
            );

        enemy.shield = false;

        logBattle(
            `🛡️ ${enemy.name}'s Super Shield blocks most of the damage!`
        );
    }

    hechie.hp =
        Math.max(
            0,
            hechie.hp - damage
        );

    logBattle(
        `💥 ${enemy.name} attacks Hechie for ${damage} damage!`
    );
}

/* =====================================================
   DAMAGE CALCULATION
   ===================================================== */

function calculateDamage(attack, defense) {

    /*
       Your requested mechanic:

       Damage taken =
       Attack - Defence

       Minimum damage is 1.
    */

    return Math.max(
        1,
        Math.floor(attack - defense)
    );
}

/* =====================================================
   BATTLE END
   ===================================================== */

function checkBattleEnd() {

    const alive =
        currentEnemies.filter(
            e => e.hp > 0
        );

    if (hechie.hp <= 0) {

        enableCommands(false);

        showMessage(
            "Defeat",
            "Hechie has been defeated."
        );

        return true;
    }

    if (alive.length === 0) {

        let totalLoot = 0;

        currentEnemies.forEach(enemy => {

            const loot =
                Math.floor(
                    Math.random() *
                    (enemy.lootMax - enemy.lootMin + 1)
                ) + enemy.lootMin;

            totalLoot += loot;

        });

        ddCoins += totalLoot;

        showMessage(
            "Victory! 🎉",
            `All enemies defeated! You found ${totalLoot} DD-coins.`
        );

        return true;
    }

    return false;
}

/* =====================================================
   END BATTLE
   ===================================================== */

function endBattle() {

    battleActive = false;

    document.getElementById("battle").style.display = "none";

    enableCommands(true);

    currentEnemies = [];

    buildTurnOrder();

    renderBattle();

}

/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(title, text) {

    document.getElementById("messageTitle")
        .textContent = title;

    document.getElementById("messageText")
        .textContent = text;

    document.getElementById("message")
        .style.display = "flex";

    enableCommands(false);
}

function closeMessage() {

    document.getElementById("message")
        .style.display = "none";

    if (
        hechie.hp <= 0
    ) {

        hechie.hp =
            Math.floor(
                hechie.maxHP * .5
            );

        hechie.energy =
            hechie.maxEnergy;
    }

    endBattle();

    updateTopUI();
}

/* =====================================================
   BATTLE LOG
   ===================================================== */

function logBattle(text) {

    const log =
        document.getElementById("battleLog");

    const line =
        document.createElement("div");

    line.textContent = text;

    log.appendChild(line);

    while (log.children.length > 5) {
        log.removeChild(log.firstChild);
    }

    log.scrollTop = log.scrollHeight;
}

/* =====================================================
   RENDER BATTLE
   ===================================================== */

function renderBattle() {

    const formation =
        document.getElementById("enemyFormation");

    formation.innerHTML = "";

    currentEnemies.forEach((enemy, index) => {

        const card =
            document.createElement("div");

        card.className =
            "battle-enemy";

        if (enemy.hp <= 0) {
            card.classList.add("dead");
        }

        card.onclick = () => {

            if (enemy.hp > 0) {
                battleTarget = enemy;

                logBattle(
                    `🎯 Target selected: ${enemy.name}`
                );
            }

        };

        const hpPercent =
            Math.max(
                0,
                (enemy.hp / enemy.maxHP) * 100
            );

        card.innerHTML = `

            <div
                class="enemy-visual"
                style="background:${getEnemyColor(enemy.name)}">
            </div>

            <div class="battle-name">
                ${enemy.name}
            </div>

            <div>
                Lv ${enemy.level}
            </div>

            <div class="hp-bar">
                <div
                    class="hp-fill"
                    style="width:${hpPercent}%">
                </div>
            </div>

            <div style="font-size:10px;margin-top:3px;">
                ${enemy.hp} / ${enemy.maxHP} HP
            </div>

        `;

        formation.appendChild(card);

    });

    renderParty();

    updateTopUI();
}

/* =====================================================
   PARTY
   ===================================================== */

function renderParty() {

    const party =
        document.getElementById("party");

    party.innerHTML = "";

    const member =
        document.createElement("div");

    member.className =
        "party-member";

    const hpPercent =
        Math.max(
            0,
            hechie.hp /
            hechie.maxHP *
            100
        );

    const energyPercent =
        Math.max(
            0,
            hechie.energy /
            hechie.maxEnergy *
            100
        );

    member.innerHTML = `

        <div class="name">
            ⚔️ Hechie
        </div>

        <div>
            Lv ${hechie.level}
        </div>

        <div>
            ❤️ ${hechie.hp}/${hechie.maxHP}
        </div>

        <div class="hp-bar">
            <div
                class="hp-fill"
                style="width:${hpPercent}%">
            </div>
        </div>

        <div>
            ⚡ ${hechie.energy}/${hechie.maxEnergy}
        </div>

        <div class="energy-bar">
            <div
                class="energy-fill"
                style="width:${energyPercent}%">
            </div>
        </div>

    `;

    party.appendChild(member);
}

/* =====================================================
   ENEMY COLORS
   ===================================================== */

function getEnemyColor(name) {

    return enemyDatabase[name]
        ? enemyDatabase[name].color
        : "#777";
}

/* =====================================================
   HIGHLIGHT TURN
   ===================================================== */

function highlightTurn(id) {

    const cards =
        document.querySelectorAll(".battle-enemy");

    cards.forEach((card, index) => {

        card.classList.remove("active");

        const enemy =
            currentEnemies[index];

        if (
            enemy &&
            enemy.id === id
        ) {
            card.classList.add("active");
        }
    });
}

/* =====================================================
   SIMPLE ATTACK ANIMATION
   ===================================================== */

function animateEnemy(id) {

    const cards =
        document.querySelectorAll(".battle-enemy");

    cards.forEach((card, index) => {

        const enemy =
            currentEnemies[index];

        if (
            enemy &&
            enemy.id === id
        ) {

            card.animate(
                [
                    { transform: "translateX(0)" },
                    { transform: "translateX(-12px)" },
                    { transform: "translateX(12px)" },
                    { transform: "translateX(0)" }
                ],
                {
                    duration: 300
                }
            );

        }
    });
}

/* =====================================================
   COMMAND ENABLE/DISABLE
   ===================================================== */

function enableCommands(enabled) {

    document.querySelectorAll(".command")
        .forEach(button => {
            button.disabled = !enabled;
        });
}

/* =====================================================
   TOP UI
   ===================================================== */

function updateTopUI() {

    document.getElementById("levelText")
        .textContent =
        hechie.level;

    document.getElementById("hpText")
        .textContent =
        hechie.hp;

    document.getElementById("coins")
        .textContent =
        ddCoins;
}

/* =====================================================
   JOYSTICK
   ===================================================== */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joystickCenter = {
    x: 0,
    y: 0
};

let joystickRadius = 0;

function setupJoystick() {

    const rect =
        joystick.getBoundingClientRect();

    joystickCenter.x =
        rect.left +
        rect.width / 2;

    joystickCenter.y =
        rect.top +
        rect.height / 2;

    joystickRadius =
        rect.width / 2 - 31;
}

function moveStick(clientX, clientY) {

    const dx =
        clientX -
        joystickCenter.x;

    const dy =
        clientY -
        joystickCenter.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const angle =
        Math.atan2(dy, dx);

    const limited =
        Math.min(
            distance,
            joystickRadius
        );

    const stickX =
        Math.cos(angle) *
        limited;

    const stickY =
        Math.sin(angle) *
        limited;

    stick.style.transform =
        `translate(${stickX}px, ${stickY}px)`;

    const strength =
        limited /
        joystickRadius;

    if (battleActive) return;

    const speed =
        2.7 * strength;

    playerX +=
        (stickX / joystickRadius) *
        speed;

    playerY +=
        (stickY / joystickRadius) *
        speed;

    playerX =
        Math.max(
            -45,
            Math.min(45, playerX)
        );

    playerY =
        Math.max(
            -35,
            Math.min(35, playerY)
        );

    /*
       Player remains visually centered.
       The world moves in the opposite direction.
    */

    const world =
        document.getElementById("worldCanvas");

    world.style.transform =
        `translate(${-playerX * 5}px, ${-playerY * 5}px)`;
}

function resetStick() {

    stick.style.transform =
        "translate(0,0)";

    joystickActive = false;
}

joystick.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        setupJoystick();

        joystickActive = true;

        const touch =
            e.touches[0];

        moveStick(
            touch.clientX,
            touch.clientY
        );

    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        if (!joystickActive) return;

        const touch =
            e.touches[0];

        moveStick(
            touch.clientX,
            touch.clientY
        );

    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        resetStick();

    },
    {passive:false}
);

/* Mouse support for testing */

joystick.addEventListener(
    "mousedown",
    e => {

        setupJoystick();

        joystickActive = true;

        moveStick(
            e.clientX,
            e.clientY
        );
    }
);

window.addEventListener(
    "mousemove",
    e => {

        if (!joystickActive) return;

        moveStick(
            e.clientX,
            e.clientY
        );

    }
);

window.addEventListener(
    "mouseup",
    resetStick
);

/* =====================================================
   INITIALIZE
   ===================================================== */

createWorldEnemies();

updateTopUI();

setupJoystick();

window.addEventListener(
    "resize",
    setupJoystick
);

</script>
